<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="s" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.1"/></filter>
    <clipPath id="rq"><rect x="0" y="44" width="0" height="32"><animate attributeName="width" from="0" to="420" begin="0.4s" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.4 1" keyTimes="0;1"/></rect></clipPath><clipPath id="r0"><rect x="0" y="192" width="0" height="32"><animate attributeName="width" from="0" to="820" begin="1.9s" dur="1.35s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.4 1" keyTimes="0;1"/></rect></clipPath><clipPath id="r1"><rect x="0" y="220" width="0" height="32"><animate attributeName="width" from="0" to="820" begin="3.3499999999999996s" dur="1.35s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.4 1" keyTimes="0;1"/></rect></clipPath><clipPath id="r2"><rect x="0" y="248" width="0" height="32"><animate attributeName="width" from="0" to="820" begin="4.8s" dur="1.35s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.4 1" keyTimes="0;1"/></rect></clipPath>
  </defs>
  <circle cx="28" cy="16" r="6" fill="#00000026"/>
  <rect x="422" y="12" width="36" height="4" rx="2" fill="#0000002e"/>
  <!-- the bar -->
  <g filter="url(#s)"><rect x="12" y="32" width="856" height="56" rx="28" fill="#ffffff" stroke="#00000014"/></g>
  <circle cx="46" cy="60" r="19" fill="#3366e8"><animate attributeName="r" values="19;21;19" dur="2.4s" repeatCount="indefinite"/></circle>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="41.5" y="49" width="9" height="14" rx="4.5" fill="#fff" stroke="none"/><path d="M37.5 58.5a8.5 8.5 0 0 0 17 0M46 67v4"/></g>
  <text x="78" y="66" clip-path="url(#rq)" font-size="15.5" font-weight="600" fill="#1d1d1f">Хто ти і що зараз будуєш?</text>
  <text x="718" y="66" font-size="14" fill="#6e6e73">✦</text>
  <text x="752" y="66" font-size="14.5" font-weight="600" fill="#1d1d1f">⚡ Авто</text>
  <!-- the answer card -->
  <g filter="url(#s)"><rect x="12" y="100" width="856" height="220" rx="20" fill="#ffffff" stroke="#00000014"/></g>
  <text x="40" y="134" font-size="13.5" font-weight="600" fill="#1d1d1f"><tspan fill="#6e6e73">✦  </tspan>Відповідь</text>
  <rect x="32" y="148" width="816" height="34" rx="11" fill="#f2f2f4"/>
  <text x="48" y="170" font-size="13.5" font-weight="600" fill="#1d1d1f">Хто ти і що зараз будуєш?</text>
    <text x="40" y="214" clip-path="url(#r0)" font-size="15.5" fill="#1d1d1f">Привіт! Я dxty — роблю продукти, якими сам користуюся щодня.</text>
  <text x="40" y="242" clip-path="url(#r1)" font-size="15.5" fill="#1d1d1f">Зараз будую Questionio: AI-копілот для дзвінків, співбесід і пар на macOS.</text>
  <text x="40" y="270" clip-path="url(#r2)" font-size="15.5" fill="#1d1d1f">Пишу на Swift, TypeScript, Python, Java і C# — від SwiftUI до Next.js і FastAPI.</text>
  <text x="40" y="302" font-size="11.5" fill="#6e6e73" opacity="0">⚡  Перший токен 0.84 с · усього 2.31 с<animate attributeName="opacity" from="0" to="1" begin="6.4s" dur="0.6s" fill="freeze"/></text>
</svg>

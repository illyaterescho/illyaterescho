name: Змійка з графіка внесків

on:
  schedule:
    - cron: "0 3 * * *"   # раз на добу
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#3366e8&color_dots=#ebedf0,#c6d4f7,#93adf0,#5f86e8,#3366e8
            dist/snake-dark.svg?palette=github-dark&color_snake=#4c7dff&color_dots=#161b22,#1c2a52,#26408a,#3559c4,#4c7dff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
